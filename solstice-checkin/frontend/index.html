<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solstice Check-In</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>Solstice Check-In</h1>
            <p>Tech Conference 2026</p>
        </header>

        <section class="check-in-card">

            <h2>Attendee Check-In</h2>

            <input
                type="text"
                id="attendeeId"
                placeholder="Enter attendee ID e.g. A001"
            >

            <button id="checkInButton">
                Check In
            </button>

            <div id="status"></div>

        </section>

        <section class="attendees-section">

            <h2>Attendees</h2>

            <div id="attendeeList"></div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
